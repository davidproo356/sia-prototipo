# Fase 0: SOLO database funciona. Los servicios del perfil app necesitan código.
name: ${COMPOSE_PROJECT_NAME:-sia-prototipo}
services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:?Establece DB_NAME}
      POSTGRES_USER: ${DB_USER:?Establece DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Establece DB_PASSWORD}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - sia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sia_private]
  ai:
    profiles: ["app"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "${AI_BIND_IP:-127.0.0.1}:${AI_PORT:-8000}:8000"
    networks: [sia_private]
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Establece DB_NAME}
      DB_USER: ${DB_USER:?Establece DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Establece DB_PASSWORD}
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      ai:
        condition: service_started
    networks: [sia_private]
volumes:
  sia_postgres_data:
networks:
  sia_private:
    driver: bridge
